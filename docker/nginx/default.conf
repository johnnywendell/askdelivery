upstream askdelivery {
    server web:8000;
}

# HTTP
server {
    listen 80;
    server_name ask.singularcode.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name ask.singularcode.net;

    ssl_certificate /etc/letsencrypt/live/ask.singularcode.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ask.singularcode.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://askdelivery;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets / Django Channels
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}