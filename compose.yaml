services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: askdelivery_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

    networks:
      - askdelivery_network


  web:
    build: .
    container_name: askdelivery_web
    restart: unless-stopped

    command: >
      daphne
      -b 0.0.0.0
      -p 8000
      askdelivery.asgi:application

    env_file:
      - .env

    volumes:
      - ./:/host_project
      - ./media:/app/media
      - staticfiles:/app/staticfiles

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - askdelivery_network

  certbot:
    image: certbot/certbot:latest
    profiles:
      - tools

    volumes:
      - ./docker/certbot/www:/var/www/certbot
      - ./docker/certbot/conf:/etc/letsencrypt
      
  redis:
    image: redis:7-alpine
    container_name: askdelivery_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - askdelivery_network

  nginx:
    image: nginx:stable-alpine
    container_name: askdelivery_nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443" 

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro 

    depends_on:
      - web

    networks:
      - askdelivery_network

volumes:
  redis_data:
  staticfiles:

networks:
  askdelivery_network:
    driver: bridge
